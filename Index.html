<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>51PAY Official</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:'Poppins',sans-serif;
    background:#0f172a;
    overflow:hidden;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    position:relative;
}

.bg{
    position:absolute;
    width:100%;
    height:100%;
    background:linear-gradient(135deg,#0f172a,#111827,#1e293b);
}

.circle{
    position:absolute;
    border-radius:50%;
    filter:blur(80px);
    opacity:0.5;
}

.c1{
    width:300px;
    height:300px;
    background:#ff0080;
    top:-80px;
    left:-50px;
}

.c2{
    width:280px;
    height:280px;
    background:#00c6ff;
    bottom:-80px;
    right:-40px;
}

.card{
    position:relative;
    width:90%;
    max-width:390px;
    background:rgba(255,255,255,0.08);
    backdrop-filter:blur(16px);
    border:1px solid rgba(255,255,255,0.15);
    border-radius:28px;
    padding:40px 28px;
    text-align:center;
    box-shadow:0 10px 40px rgba(0,0,0,0.5);
    z-index:2;
}

.logo{
    width:85px;
    height:85px;
    margin:auto;
    border-radius:22px;
    background:linear-gradient(135deg,#ff512f,#dd2476);
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:34px;
    font-weight:700;
    color:white;
    margin-bottom:18px;
    box-shadow:0 5px 20px rgba(255,81,47,0.4);
}

h1{
    color:white;
    font-size:34px;
    margin-bottom:10px;
    letter-spacing:1px;
}

p{
    color:#cbd5e1;
    font-size:14px;
    margin-bottom:28px;
    line-height:1.6;
}

.btn{
    display:block;
    text-decoration:none;
    padding:16px;
    margin:16px 0;
    border-radius:16px;
    font-size:17px;
    font-weight:600;
    transition:0.3s ease;
    color:white;
    position:relative;
    overflow:hidden;
}

.btn::before{
    content:'';
    position:absolute;
    top:0;
    left:-100%;
    width:100%;
    height:100%;
    background:rgba(255,255,255,0.2);
    transition:0.4s;
}

.btn:hover::before{
    left:100%;
}

.btn:hover{
    transform:translateY(-3px) scale(1.02);
}

.register{
    background:linear-gradient(135deg,#ff512f,#f09819);
}

.channel{
    background:linear-gradient(135deg,#0072ff,#00c6ff);
}

.contact{
    background:linear-gradient(135deg,#11998e,#38ef7d);
}

.footer{
    margin-top:24px;
    color:#94a3b8;
    font-size:12px;
    letter-spacing:1px;
}
</style>
</head>

<body>

<div class="bg"></div>
<div class="circle c1"></div>
<div class="circle c2"></div>

<div class="card">

<div class="logo">51</div>

<h1>51PAY</h1>

<p>
Fast Registration • Community Updates • Direct Support
</p>

<a class="btn register" href="https://app.51pay.monster/rs/gEQkGh5k7N" target="_blank">
Register Now
</a>

<a class="btn channel" href="https://t.me/+0UakUOpCVXtjZjBl" target="_blank">
Join Telegram Channel
</a>

<a class="btn contact" href="https://t.me/vi_nmi" target="_blank">
Contact Support
</a>

<div class="footer">
OFFICIAL COMMUNITY PAGE
</div>

</div>

</body>
</html>
